<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Two inference paths on the NXP FRDM-i.MX95</title>
  <desc id="diagram-desc">Path A loads the Qwen2.5-0.5B-Instruct Q4_K_M GGUF in llama.cpp on the ARM64 CPU and measures prompt processing, generation, and process peak memory. Path B loads the packaged Danube-500M-q8 ONNX model in NXP eIQ GenAI Flow and selects either the CPU or Neutron execution provider. It measures time to first token, generation rate, processing, initialization, and mean system memory. Operator placement is unverified.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#52657b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="442" rx="20" fill="#f5f7fa" stroke="#d5dee8"/>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="43" fill="#101e32" font-size="25" font-weight="700">NXP FRDM-i.MX95</text>
    <text x="24" y="68" fill="#425568" font-size="15">AArch64 · NXP i.MX Linux</text>

    <rect x="24" y="88" width="444" height="332" rx="14" fill="#fff" stroke="#cad8e6"/>
    <rect x="492" y="88" width="444" height="332" rx="14" fill="#fff" stroke="#cad8e6"/>
    <text x="46" y="121" fill="#154f78" font-size="19" font-weight="700">A. llama.cpp on the ARM64 CPU</text>
    <text x="514" y="121" fill="#165e52" font-size="19" font-weight="700">B. NXP eIQ GenAI Flow</text>

    <g fill="#edf6ff" stroke="#bad3e9">
      <rect x="46" y="139" width="400" height="49" rx="8"/>
      <rect x="46" y="209" width="400" height="39" rx="8"/>
      <rect x="46" y="279" width="400" height="37" rx="8"/>
    </g>
    <g fill="#edf8f4" stroke="#bcded3">
      <rect x="514" y="139" width="400" height="49" rx="8"/>
      <rect x="514" y="209" width="400" height="39" rx="8"/>
      <rect x="514" y="279" width="193" height="37" rx="8"/>
      <rect x="721" y="279" width="193" height="37" rx="8"/>
    </g>

    <g fill="none" stroke="#52657b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M 246 188 V 206"/>
      <path d="M 246 248 V 276"/>
      <path d="M 714 188 V 206"/>
      <path d="M 714 248 V 263 H 611 V 276"/>
      <path d="M 714 248 V 263 H 817 V 276"/>
    </g>
    <g fill="#101e32" text-anchor="middle" font-size="15" font-weight="650">
      <text x="246" y="159">Qwen2.5-0.5B-Instruct</text>
      <text x="246" y="233">llama.cpp</text>
      <text x="246" y="302">ARM64 CPU</text>
      <text x="714" y="159">Danube-500M-q8</text>
      <text x="714" y="233">ONNX Runtime</text>
    </g>
    <g fill="#425568" text-anchor="middle" font-size="13.5">
      <text x="246" y="177">Q4_K_M GGUF</text>
      <text x="714" y="177">Packaged ONNX model</text>
      <text x="611" y="302" fill="#101e32" font-weight="650">CPUExecutionProvider</text>
      <text x="817" y="302" fill="#101e32" font-weight="650">NeutronExecutionProvider</text>
      <text x="714" y="337">Provider selection · operator placement unverified</text>
    </g>

    <path d="M 46 352 H 446 M 514 352 H 914" stroke="#d5dee8"/>
    <g fill="#27384b" font-size="14">
      <text x="46" y="377">Prompt processing and generation rates</text>
      <text x="46" y="399">Process peak resident memory (VmHWM)</text>
      <text x="514" y="377">TTFT, generation rate, processing and initialization times</text>
      <text x="514" y="399">Mean system memory used</text>
    </g>
  </g>
</svg>
